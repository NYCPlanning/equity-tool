services:
  nginx:
    image: nginx:stable
    container_name: equitableexplorer-nginx-test
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./conf.d:/etc/nginx/conf.d:ro
      - ./snippets:/etc/nginx/snippets:ro
      - ./bots.d:/etc/nginx/bots.d:ro
      - ./certs:/etc/nginx/certs:ro
      - ./www:/var/www/html:ro
    restart: unless-stopped