name: ✅ Push to Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint:
    name: 🔎 Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node environment
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.3
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs:
      - lint

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node environment
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.3
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

  deploy-preview:
    name: Preview Deploy
    runs-on: ubuntu-latest
    needs:
      - lint
      - test

    environment:
      name: staging
      url: https://staging-equitableexplorer.planninglabs.nyc

    env:
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

      NEXT_PUBLIC_CARTO_USERNAME: ${{ secrets.CARTO_USERNAME }}
      NEXT_PUBLIC_CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
      NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
      NEXT_PUBLIC_DO_SPACE_URL: ${{ secrets.DO_SPACE_URL }}

      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
      FROM_EDDE_EMAIL: ${{ secrets.FROM_EDDE_EMAIL }}
      TO_EDDE_EMAIL: ${{ secrets.TO_EDDE_EMAIL }}

      NEWSLETTER_ENDPOINT: ${{ secrets.NEWSLETTER_ENDPOINT }}
      NEWSLETTER_LIST_ID: ${{ secrets.NEWSLETTER_LIST_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node environment for Netlify CLI
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify installed versions
        shell: bash
        run: |
          set -euo pipefail

          echo "Node version:"
          node --version

          echo "npm version:"
          npm --version

          echo "Netlify CLI version:"
          npx --no-install netlify --version

          echo "Next.js version:"
          node -p "require('next/package.json').version"

      - name: Verify Netlify credentials
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${NETLIFY_SITE_ID:-}" ]; then
            echo "::error::NETLIFY_SITE_ID is missing"
            exit 1
          fi

          if [ -z "${NETLIFY_AUTH_TOKEN:-}" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN is missing"
            exit 1
          fi

          CLEAN_NETLIFY_SITE_ID="$(
            printf '%s' "$NETLIFY_SITE_ID" |
              tr -d '[:space:]'
          )"

          CLEAN_NETLIFY_AUTH_TOKEN="$(
            printf '%s' "$NETLIFY_AUTH_TOKEN" |
              tr -d '\r\n'
          )"

          USER_HTTP_STATUS="$(
            curl \
              --silent \
              --show-error \
              --output "$RUNNER_TEMP/netlify-user.json" \
              --write-out "%{http_code}" \
              --header "Authorization: Bearer $CLEAN_NETLIFY_AUTH_TOKEN" \
              "https://api.netlify.com/api/v1/user"
          )"

          echo "Netlify user endpoint returned HTTP $USER_HTTP_STATUS"

          if [ "$USER_HTTP_STATUS" != "200" ]; then
            echo "::error::NETLIFY_AUTH_TOKEN is invalid or inaccessible."
            cat "$RUNNER_TEMP/netlify-user.json"
            exit 1
          fi

          SITE_HTTP_STATUS="$(
            curl \
              --silent \
              --show-error \
              --output "$RUNNER_TEMP/netlify-site.json" \
              --write-out "%{http_code}" \
              --header "Authorization: Bearer $CLEAN_NETLIFY_AUTH_TOKEN" \
              "https://api.netlify.com/api/v1/sites/$CLEAN_NETLIFY_SITE_ID"
          )"

          echo "Netlify site endpoint returned HTTP $SITE_HTTP_STATUS"

          if [ "$SITE_HTTP_STATUS" != "200" ]; then
            echo "::error::The token cannot access the configured Netlify project."
            cat "$RUNNER_TEMP/netlify-site.json"
            exit 1
          fi

          node <<'NODE'
          const fs = require('fs');

          const site = JSON.parse(
            fs.readFileSync(
              `${process.env.RUNNER_TEMP}/netlify-site.json`,
              'utf8'
            )
          );

          console.log('Resolved Netlify project:');
          console.log({
            name: site.name,
            url: site.url,
            accountName: site.account_name,
            repository: site.repo_url,
          });

          if (site.name !== 'equity-tool') {
            console.error(
              '::error::NETLIFY_SITE_ID resolved to an unexpected project.'
            );

            process.exit(1);
          }
          NODE

          echo "Netlify credentials are valid."

      - name: Create build environment file
        shell: bash
        run: |
          set -euo pipefail

          {
            printf 'FROM_EDDE_EMAIL=%s\n' "$FROM_EDDE_EMAIL"
            printf 'TO_EDDE_EMAIL=%s\n' "$TO_EDDE_EMAIL"
            printf 'SENDGRID_API_KEY=%s\n' "$SENDGRID_API_KEY"
            printf 'NEWSLETTER_ENDPOINT=%s\n' "$NEWSLETTER_ENDPOINT"
            printf 'NEWSLETTER_LIST_ID=%s\n' "$NEWSLETTER_LIST_ID"
          } >> .env

      - name: Deploy Staging Preview
        shell: bash
        run: |
          set -euo pipefail

          CLEAN_NETLIFY_SITE_ID="$(
            printf '%s' "$NETLIFY_SITE_ID" |
              tr -d '[:space:]'
          )"

          CLEAN_NETLIFY_AUTH_TOKEN="$(
            printf '%s' "$NETLIFY_AUTH_TOKEN" |
              tr -d '\r\n'
          )"

          echo "Starting staging preview deployment."

          npx --no-install netlify deploy \
            --build \
            --context deploy-preview \
            --alias staging \
            --site "$CLEAN_NETLIFY_SITE_ID" \
            --auth "$CLEAN_NETLIFY_AUTH_TOKEN" \
            --debug